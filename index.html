  <nav id="tabs" class="flex items-end gap-1 flex-1 overflow-x-auto"><div class="group flex items-center gap-1.5 pl-3 pr-1.5 my-1 rounded-md text-sm cursor-pointer whitespace-nowrap transition-colors bg-zinc-800 text-white"><span class="py-1.5 truncate max-w-[160px]">2048</span>

  <button id="newTab" class="my-1 shrink-0 px-3 py-1.5 rounded-md text-sm font-medium border border-dashed border-zinc-700 text-zinc-400 hover:border-indigo-500 hover:text-indigo-400 transition-colors">

  <div id="empty" class="absolute inset-0 flex flex-col items-center justify-center gap-4 text-center px-6 hidden">

    <div>
      <h1 class="text-xl font-semibold text-zinc-200">Drop an HTML file to deploy</h1>
      <p class="text-sm text-zinc-500 mt-1">Drag a <code class="text-indigo-400">.html</code> file, a <em>folder</em>, or a <code class="text-indigo-400">.zip</code> anywhere — or paste raw HTML (⌘/Ctrl-V).</p>

  </div>
</main>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg bg-zinc-800 text-sm text-zinc-100 shadow-lg opacity-0 pointer-events-none transition-opacity z-50"></div>

<script>
// ⬇️ paste your deployed Worker URL here (no trailing slash)
const WORKER = 'https://artifact-store.mrdupes.workers.dev';

const KEY = 'deployer.tabs.v1';

let tabs = [];       // [{id, name, route, deploying}]  route = R2 path after WORKER; iframe → WORKER/route
let active = null;

const $ = s => document.querySelector(s);
const tabsEl = $('#tabs'), frame = $('#frame'), empty = $('#empty'), overlay = $('#overlay');
const uid = () => 't' + Math.random().toString(36).slice(2, 9);
const slug = s => s.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const junk = p => /(^|\/)\.DS_Store$/.test(p) || p.includes('__MACOSX');
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = '0', 1800);
}

function save() { localStorage.setItem(KEY, JSON.stringify({ tabs, active })); }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s?.tabs) { tabs = s.tabs; active = s.active; } } catch {}
}

// Which HTML is the entry? index.html > name match (wordle → RippitWordle) > sole html > ask.
function pickEntry(files, name) {
  const htmls = files.filter(f => /\.html?$/i.test(f.path));
  if (!htmls.length) return null;
  const idx = htmls.find(f => /(^|\/)index\.html?$/i.test(f.path));
  if (idx) return idx.path;
  if (htmls.length === 1) return htmls[0].path;
  const s = slug(name);
  const match = s && htmls.find(f => slug(f.path.split('/').pop()).includes(s));
  if (match) return match.path;
  const n = parseInt(prompt('Multiple HTML files — pick the entry:\n\n'
    + htmls.map((f, i) => `${i + 1}. ${f.path}`).join('\n'), '1'), 10);
  return (htmls[(n || 1) - 1] || htmls[0]).path;
}

// Upload every file under a key. files: [{path, blob}]. Returns on all-done.
async function deploy(name, files) {
  files = files.filter(f => !junk(f.path));
  const entry = pickEntry(files, name);
  if (!entry) return toast('No HTML file found');
  const key = slug(name) || uid();
  // clean route when a lone/index entry; explicit file when the folder has several htmls
  const lone = files.filter(f => /\.html?$/i.test(f.path)).length === 1 || /(^|\/)index\.html?$/i.test(entry);
  const route = lone ? key + '/' : key + '/' + entry;
  const tab = { id: uid(), name, route: null, deploying: true };
  tabs.push(tab); active = tab.id; save(); render();
  toast(`Deploying ${files.length} file(s)…`);
  try {
    await Promise.all(files.map(async f => {
      const r = await fetch(`${WORKER}/${key}/${encPath(f.path)}`, { method: 'POST', body: f.blob });
      if (!r.ok) throw new Error(f.path);
    }));
    tab.route = route; tab.deploying = false; save(); render(); toast('Deployed');
  } catch { tab.deploying = false; toast('Deploy failed'); }
}

function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id); if (i < 0) return;
  tabs.splice(i, 1);
  if (active === id) active = tabs.length ? tabs[Math.max(0, i - 1)].id : null;
  save(); render();
}

function selectTab(id) { active = id; save(); render(); }

function syncHash() {
  const t = tabs.find(t => t.id === active);
  const h = t?.route ? '#' + t.route : '';
  if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
}

function renderFrame() {
  const t = tabs.find(t => t.id === active);
  $('#copyLink').disabled = !t || !t.route;
  if (!t) { frame.classList.add('hidden'); empty.classList.remove('hidden'); frame.removeAttribute('src'); return; }
  empty.classList.add('hidden'); frame.classList.remove('hidden');
  const url = t.route ? `${WORKER}/${encPath(t.route)}` : 'about:blank';
  if (frame.src !== url) frame.src = url;
}

function renderTabs() {
  tabsEl.innerHTML = '';
  tabs.forEach(t => {
    const on = t.id === active;
    const el = document.createElement('div');
    el.className = 'group flex items-center gap-1.5 pl-3 pr-1.5 my-1 rounded-md text-sm cursor-pointer whitespace-nowrap transition-colors '
      + (on ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:bg-zinc-800/50');
    el.innerHTML = `<span class="py-1.5 truncate max-w-[160px]"></span>
      <button class="w-5 h-5 rounded flex items-center justify-center text-zinc-500 hover:text-white hover:bg-zinc-700 ${on ? '' : 'opacity-0 group-hover:opacity-100'}">×</button>`;
    el.querySelector('span').textContent = t.name;
    el.querySelector('span').ondblclick = () => rename(t);
    el.onclick = e => { if (e.target.tagName !== 'BUTTON') selectTab(t.id); };
    el.querySelector('button').onclick = e => { e.stopPropagation(); closeTab(t.id); };
    tabsEl.appendChild(el);
  });
}

function rename(t) {
  const n = prompt('Rename tab', t.name);
  if (n && n.trim()) { t.name = n.trim(); save(); renderTabs(); }
}

function render() { renderTabs(); renderFrame(); syncHash(); }

function ingest(html, name) {
  if (!html?.trim()) return toast('Nothing to deploy');
  if (WORKER.startsWith('PASTE')) return toast('Set the Worker URL first');
  const blob = new Blob([html], { type: 'text/html' });
  deploy(name, [{ path: (slug(name) || 'index') + '.html', blob }]);
}

// Recursively read a webkitEntry into [{path, blob}] (path relative to `prefix`).
async function collect(entry, prefix = '') {
  if (entry.isFile) {
    const file = await new Promise(r => entry.file(r));
    return [{ path: prefix + entry.name, blob: file }];
  }
  const reader = entry.createReader();
  const kids = [];
  for (;;) { const b = await new Promise(r => reader.readEntries(r)); if (!b.length) break; kids.push(...b); }
  const sub = await Promise.all(kids.map(k => collect(k, prefix + entry.name + '/')));
  return sub.flat();
}

// If every path shares one top folder (e.g. GitHub/Claude zips), return "dir/".
function commonTop(paths) {
  if (!paths.length) return null;
  const first = paths[0].split('/')[0] + '/';
  return paths.every(p => p.startsWith(first)) && paths.some(p => p.length > first.length) ? first : null;
}

// Unzip in-browser → deploy contents. Strips a single wrapping folder if present.
async function fromZip(file) {
  toast('Unzipping…');
  const zip = await JSZip.loadAsync(file);
  const paths = Object.keys(zip.files).filter(p => !zip.files[p].dir && !junk(p));
  if (!paths.length) return toast('Empty zip');
  const top = commonTop(paths);
  const files = await Promise.all(paths.map(async p => ({
    path: top ? p.slice(top.length) : p,
    blob: await zip.files[p].async('blob'),
  })));
  deploy((top ? top.replace(/\/$/, '') : file.name).replace(/\.zip$/i, ''), files);
}

// FileList from <input> — use webkitRelativePath, strip the top folder as the name.
function fromInput(list) {
  const files = [...list].filter(f => !junk(f.webkitRelativePath || f.name));
  if (!files.length) return;
  if (files.length === 1 && /\.zip$/i.test(files[0].name)) return fromZip(files[0]);
  const rels = files.map(f => f.webkitRelativePath || f.name);
  const top = rels[0].includes('/') ? rels[0].split('/')[0] : null;
  const items = files.map((f, i) => ({ path: top ? rels[i].slice(top.length + 1) : rels[i], blob: f }));
  deploy(top || files[0].name.replace(/\.html?$/i, ''), items);
}

let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) overlay.classList.replace('hidden', 'flex'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.replace('flex', 'hidden'); } });
window.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; overlay.classList.replace('flex', 'hidden');
  const entries = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) {
    for (const en of entries) {
      if (en.isDirectory) {
        const files = await collect(en, ''); // paths incl. the folder name…
        const strip = en.name + '/';
        deploy(en.name, files.map(f => ({ path: f.path.startsWith(strip) ? f.path.slice(strip.length) : f.path, blob: f.blob })));
      } else {
        const file = await new Promise(r => en.file(r));
        if (/\.zip$/i.test(file.name)) await fromZip(file);
        else deploy(file.name.replace(/\.html?$/i, ''), [{ path: file.name, blob: file }]);
      }
    }
    return;
  }
  const t = e.dataTransfer.getData('text'); if (t) ingest(t, 'pasted');
});

window.addEventListener('paste', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const t = e.clipboardData.getData('text');
  if (t && /<[a-z!]/i.test(t)) { e.preventDefault(); ingest(t, 'pasted'); }
});

$('#newTab').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.zip,.html,.htm'; inp.multiple = true;
  inp.onchange = () => fromInput(inp.files);
  inp.click();
};

$('#copyLink').onclick = () => {
  const t = tabs.find(t => t.id === active);
  if (!t) return;
  if (!t.route) return toast('Still uploading…');
  navigator.clipboard.writeText(location.origin + location.pathname + '#' + t.route)
    .then(() => toast('Link copied'), () => toast('Copy failed'));
};

// ── Boot ──
// Capture shared key BEFORE render()/syncHash() clobbers the hash.
const shared = decodeURIComponent(location.hash.slice(1));
load();

if (shared) {
  let t = tabs.find(t => t.route === shared);
  if (!t) { t = { id: uid(), name: shared.split('/')[0], route: shared }; tabs.push(t); }
  active = t.id; save();
}
render();
</script>
