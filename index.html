<script type="text/x-dc" data-dc-script="">
const SIZE = 4;

class Component extends DCLogic {
  tiles = [];
  score = 0;
  best = 0;
  won = false;
  keepPlaying = false;
  over = false;
  nextId = 1;
  boardEl = null;

  componentDidMount() {
    try { this.best = parseInt(localStorage.getItem('rippit2048-best') || '0', 10) || 0; } catch (e) {}
    this.setup();
    this._onKey = (e) => this.handleKey(e);
    window.addEventListener('keydown', this._onKey);
    this.forceUpdate();
  }
  componentWillUnmount() {
    if (this._onKey) window.removeEventListener('keydown', this._onKey);
  }

  setup() {
    this.tiles = [];
    this.score = 0;
    this.won = false;
    this.keepPlaying = false;
    this.over = false;
    this.nextId = 1;
    this.addRandom();
    this.addRandom();
  }

  emptyCells() {
    const occupied = {};
    this.tiles.forEach(t => { occupied[t.r + ',' + t.c] = true; });
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!occupied[r + ',' + c]) cells.push({ r, c });
    return cells;
  }

  addRandom() {
    const cells = this.emptyCells();
    if (!cells.length) return;
    const { r, c } = cells[Math.floor(Math.random() * cells.length)];
    this.tiles.push({ id: this.nextId++, value: Math.random() < 0.9 ? 2 : 4, r, c, isNew: true, merged: false });
  }

  buildGrid() {
    const grid = [];
    for (let r = 0; r < SIZE; r++) grid.push([null, null, null, null]);
    this.tiles.forEach(t => { grid[t.r][t.c] = t; });
    return grid;
  }

  inBounds(cell) { return cell.r >= 0 && cell.r < SIZE && cell.c >= 0 && cell.c < SIZE; }

  handleKey(e) {
    const map = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 };
    const dir = map[e.key];
    if (dir === undefined) return;
    e.preventDefault();
    this.move(dir);
  }

  move(dir) {
    if (this.over || (this.won && !this.keepPlaying)) return;
    const vectors = { 0: { r: -1, c: 0 }, 1: { r: 0, c: 1 }, 2: { r: 1, c: 0 }, 3: { r: 0, c: -1 } };
    const vector = vectors[dir];
    const order = [0, 1, 2, 3];
    const rows = vector.r === 1 ? order.slice().reverse() : order;
    const cols = vector.c === 1 ? order.slice().reverse() : order;

    this.tiles.forEach(t => { t.isNew = false; t.merged = false; });
    const grid = this.buildGrid();
    let moved = false;
    const removed = [];

    rows.forEach(r => {
      cols.forEach(c => {
        const tile = grid[r][c];
        if (!tile) return;
        let prev = { r, c };
        let cell = { r: r + vector.r, c: c + vector.c };
        while (this.inBounds(cell) && !grid[cell.r][cell.c]) {
          prev = cell;
          cell = { r: cell.r + vector.r, c: cell.c + vector.c };
        }
        const next = this.inBounds(cell) ? grid[cell.r][cell.c] : null;
        if (next && next.value === tile.value && !next.merged) {
          next.value *= 2;
          next.merged = true;
          this.score += next.value;
          if (next.value === 2048) this.won = true;
          grid[r][c] = null;
          removed.push(tile.id);
          moved = true;
        } else if (prev.r !== r || prev.c !== c) {
          grid[r][c] = null;
          grid[prev.r][prev.c] = tile;
          tile.r = prev.r; tile.c = prev.c;
          moved = true;
        }
      });
    });

    if (!moved) return;
    this.tiles = this.tiles.filter(t => !removed.includes(t.id));
    this.addRandom();

    if (this.score > this.best) {
      this.best = this.score;
      try { localStorage.setItem('rippit2048-best', String(this.best)); } catch (e) {}
    }
    if (!this.movesAvailable()) this.over = true;
    this.forceUpdate();
  }

  movesAvailable() {
    if (this.emptyCells().length) return true;
    const grid = this.buildGrid();
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c].value;
        if (r < SIZE - 1 && grid[r + 1][c].value === v) return true;
        if (c < SIZE - 1 && grid[r][c + 1].value === v) return true;
      }
    return false;
  }

  tileFace(value) {
    const map = {
      2:    ['var(--rippit-cream-100)', 'var(--rippit-green-900)'],
      4:    ['var(--rippit-cream-200)', 'var(--rippit-green-900)'],
      8:    ['var(--rippit-green-200)', 'var(--rippit-green-900)'],
      16:   ['var(--rippit-green-300)', 'var(--rippit-green-900)'],
      32:   ['var(--rippit-green-400)', 'var(--rippit-green-900)'],
      64:   ['var(--rippit-green-500)', '#fff'],
      128:  ['var(--rippit-green-600)', '#fff'],
      256:  ['var(--rippit-green-700)', '#fff'],
      512:  ['var(--rippit-green-800)', '#fff'],
      1024: ['var(--rippit-coral-300)', 'var(--rippit-green-900)'],
      2048: ['var(--rippit-coral-500)', '#fff'],
    };
    return map[value] || ['var(--rippit-green-900)', 'var(--rippit-lime-300)'];
  }

  onTouchStart = (e) => {
    const t = e.touches[0];
    this._touch = { x: t.clientX, y: t.clientY };
  };
  onTouchEnd = (e) => {
    if (!this._touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - this._touch.x;
    const dy = t.clientY - this._touch.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) this.move(dx > 0 ? 1 : 3);
    else this.move(dy > 0 ? 2 : 0);
    this._touch = null;
  };

  renderVals() {
    const gap = 4, total = 100; // percentage units
    const step = (100 - gap * 3) / 4; // cell size in %
    const pos = (i) => i * (step + gap);

    const tileEls = this.tiles.map(t => {
      const [bg, color] = this.tileFace(t.value);
      const digits = String(t.value).length;
      const fontSize = digits >= 4 ? 'clamp(18px,5.5cqw,28px)' : digits === 3 ? 'clamp(22px,7cqw,34px)' : 'clamp(28px,9cqw,44px)';
      const posStyle = {
        position: 'absolute', top: 0, left: 0,
        width: step + '%', height: step + '%',
        transform: `translate(${pos(t.c) / step * 100}%, ${pos(t.r) / step * 100}%)`,
        transition: 'transform 120ms cubic-bezier(0.2,0.8,0.2,1)',
      };
      const faceStyle = {
        width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',
        borderRadius: 12, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize, background: bg, color,
        boxShadow: t.value >= 2048 ? 'var(--shadow-glow-coral)' : (t.value >= 64 ? 'var(--shadow-sm)' : 'none'),
        animation: t.isNew ? 'r-appear 200ms cubic-bezier(0.2,0.8,0.2,1)' : (t.merged ? 'r-pop 200ms cubic-bezier(0.2,0.8,0.2,1)' : 'none'),
      };
      return React.createElement('div', { key: t.id, style: posStyle },
        React.createElement('div', { style: faceStyle }, t.value));
    });

    const showOverlay = this.over || (this.won && !this.keepPlaying);
    return {
      score: this.score,
      best: this.best,
      tileEls,
      showOverlay,
      canKeepPlaying: this.won && !this.over,
      overlayTitle: this.over ? 'Game over' : 'You hit 2048!',
      overlaySub: this.over ? 'No moves left. Rippit believes in a rematch.' : 'Nice leap. Keep going for a higher score?',
      onNew: () => { this.setup(); this.forceUpdate(); },
      onKeepPlaying: () => { this.keepPlaying = true; this.forceUpdate(); },
      boardRef: (el) => {
        if (!el || this.boardEl === el) return;
        this.boardEl = el;
        el.addEventListener('touchstart', this.onTouchStart, { passive: true });
        el.addEventListener('touchend', this.onTouchEnd, { passive: true });
      },
    };
  }
}
